<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Flags + Capitals — V3</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#111827}.wrap{max-width:1120px;margin:auto;padding:24px 14px 44px}header{text-align:center}h1{margin:0 0 6px;font-size:29px}.sub{color:#64748b;margin:6px auto;max-width:760px}.pill{display:inline-block;background:#e2e8f0;border-radius:999px;padding:6px 13px;font-weight:700;margin:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.qno{font-weight:800}.stage{font-size:12px;color:#64748b}.pic{display:flex;justify-content:center;align-items:center;margin-bottom:13px;padding:12px;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:10px}.pic img{width:min(420px,100%);display:block;background:#fff;border:2px solid #475569;border-radius:4px}.ratioframe{width:min(420px,100%);background:#fff;border:2px solid #475569;border-radius:4px;overflow:hidden}.ratioframe img{width:100%;height:100%;object-fit:fill;border:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.label{font-size:13px;font-weight:800;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}input:focus{outline:2px solid #2563eb;outline-offset:1px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}button{padding:11px 17px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:750;font-size:15px}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.out{display:none;margin-top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:15px}.out.show{display:block}pre{white-space:pre-wrap;word-break:break-word}.small{font-size:12px;color:#64748b;text-align:center}.reportcard{background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:15px}.section{margin-top:13px;border-top:1px solid #e2e8f0;padding-top:11px}.row{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;margin:5px 0}.rlabel{font-weight:800;color:#475569}.result{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:800;font-size:12px}.I{background:#dcfce7;color:#166534}.A{background:#fef3c7;color:#92400e}.W{background:#fee2e2;color:#991b1b}.C{background:#e2e8f0;color:#475569}.scorebox{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:12px 0;text-align:left}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid,.pair,.scoregrid{grid-template-columns:1fr}h1{font-size:24px}}
</style></head>
<body><main class="wrap">
<header><h1 id="title">World Flags + Capitals</h1><p id="sub" class="sub">Loading…</p><div id="pills"></div></header>
<section id="scores"></section><section id="grid" class="grid"></section>
<section id="actions" class="actions" style="display:none"><button id="build" class="primary">Build my reply</button><button id="copy" disabled>Copy reply</button><button id="clear">Clear editable fields</button></section>
<p id="noteTop" class="small"></p><section id="out" class="out"><pre id="reply"></pre><p id="note"></p></section>
</main><script>
const OWNER="amrsilver82",REPO="world-capitals-answer-sheet",p=new URLSearchParams(location.search),PIN=p.get("sha")||"",TX=p.get("tx")||"",VIEW=p.get("view")||"quiz";
const validPin=/^[0-9a-f]{40}$/i.test(PIN),validTx=/^v3\/transactions\/edition-\d+\/batch-\d+\.json$/i.test(TX);
const raw=(ref,path)=>"https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+encodeURIComponent(ref)+"/"+path.split("/").map(encodeURIComponent).join("/");
const esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[x]));
const G=document.getElementById("grid"),S=document.getElementById("scores"),A=document.getElementById("actions"),O=document.getElementById("out"),R=document.getElementById("reply"),N=document.getElementById("note"),P=document.getElementById("copy");
let qs=[],saved={},key="";
function flagHtml(asset,label,ratio){let im='<img src="'+esc(asset)+'?v='+encodeURIComponent(PIN)+'" alt="'+esc(label)+'">';return ratio?'<div class="ratioframe" style="aspect-ratio:'+esc(ratio)+'">'+im+'</div>':im}
function val(q,k){const e=document.getElementById(k+"-"+q.n);return e?e.value.trim():""}
function status(){let a=0,e=0;qs.forEach(q=>["country","capital"].forEach(k=>{e++;if(val(q,k))a++}));document.getElementById("pills").innerHTML='<span class="pill">'+a+' answered · '+(e-a)+' left</span>'}
function build(){const lines=[],blank=[];qs.forEach(q=>{const parts=[];const c=val(q,"country"),a=val(q,"capital");if(c)parts.push("Country: "+c);else blank.push("Q"+q.n+" Country");if(a)parts.push("Capital: "+a);else blank.push("Q"+q.n+" Capital");if(parts.length)lines.push(q.n+". "+parts.join(" | "))});R.textContent=lines.join("\n");N.textContent=blank.length?"Left blank: "+blank.join(", "):"All fields answered.";O.className="out show";P.disabled=!lines.length;return R.textContent}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{return false}}
function renderQuiz(d){if(!d){document.getElementById("sub").textContent="No next batch.";return}document.getElementById("title").textContent=d.title+" — Batch "+d.batch+" (Q"+d.start_question+"–"+d.end_question+")";document.getElementById("sub").textContent="Identify the country from each flag and its capital. Leave anything you do not know blank.";A.style.display="flex";qs=d.questions||[];key="v3-"+PIN+"-"+TX;try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch{saved={}};G.innerHTML="";qs.forEach(q=>{const c=document.createElement("div");c.className="card";c.innerHTML='<div class="top"><span class="qno">Question '+q.n+'</span><span class="stage" id="st-'+q.n+'"></span></div><div class="pic">'+flagHtml(q.asset,"Flag question "+q.n,q.display_ratio)+'</div><div class="pair"><div class="field"><div class="label">Country</div><input id="country-'+q.n+'" placeholder="Country" autocomplete="off"></div><div class="field"><div class="label">Capital</div><input id="capital-'+q.n+'" placeholder="Capital" autocomplete="off"></div></div>';G.appendChild(c);["country","capital"].forEach(k=>{const e=document.getElementById(k+"-"+q.n),sk=q.n+"-"+k;e.value=saved[sk]||"";e.oninput=()=>{saved[sk]=e.value;localStorage.setItem(key,JSON.stringify(saved));status();O.className="out"}})});status();document.getElementById("noteTop").textContent="V3: this URL is pinned to one immutable transaction containing the completed report and this next batch."}
function scoreCard(title,s){return '<div class="scorebox"><strong>'+esc(title)+'</strong><div>Pure: '+esc(s.pure_display)+'</div><div>Pure + Assisted: '+esc(s.pa_display)+'</div><div>Independent: '+esc(s.independent)+' · Assisted: '+esc(s.assisted)+' · Wrong: '+esc(s.wrong)+' · Cancelled: '+esc(s.cancelled)+'</div></div>'}
function renderReport(d){document.getElementById("title").textContent=d.title+" — Batch "+d.batch;document.getElementById("sub").textContent="Completed batch review · Q"+d.questions;S.innerHTML='<div class="scoregrid">'+scoreCard("This Batch — Flag",d.batch_score.flag)+scoreCard("This Batch — Capital",d.batch_score.capital)+scoreCard("Cumulative — Flag",d.cumulative.flag)+scoreCard("Cumulative — Capital",d.cumulative.capital)+'</div>';G.innerHTML=d.records.map(r=>'<article class="reportcard"><div class="top"><span class="qno">Question '+r.q+'</span></div><div class="pic">'+flagHtml(r.asset,"Flag for "+r.country_display)+'</div><div class="section"><div class="row"><div class="rlabel">Your country</div><div>'+esc((r.country_attempts||[]).join(" → ")||"—")+'</div><div class="rlabel">Country</div><div><strong>'+esc(r.country_display)+'</strong></div><div class="rlabel">Result</div><div><span class="result '+r.flag_result+'">'+esc(r.flag_result)+'</span></div></div></div><div class="section"><div class="row"><div class="rlabel">Your capital</div><div>'+esc((r.capital_attempts||[]).join(" → ")||"—")+'</div><div class="rlabel">Capital</div><div><strong>'+esc(r.capital_display)+'</strong></div><div class="rlabel">Result</div><div><span class="result '+r.capital_result+'">'+esc(r.capital_result)+'</span></div></div></div></article>').join("")}
async function load(){if(!validPin||!validTx){document.getElementById("sub").textContent="Invalid V3 transaction reference.";return}try{const r=await fetch(raw(PIN,TX),{cache:"no-store"});if(!r.ok)throw Error("transaction fetch failed");const t=await r.json();if(VIEW==="report")renderReport(t.completed_batch);else renderQuiz(t.next_batch)}catch(e){document.getElementById("sub").textContent="Could not load this V3 transaction."}}
document.getElementById("build").onclick=build;P.onclick=async()=>{const t=build(),ok=await copyText(t);N.textContent=(ok?"Copied reply. ":"Copy failed — select it manually. ")+N.textContent};document.getElementById("clear").onclick=()=>{qs.forEach(q=>["country","capital"].forEach(k=>{const e=document.getElementById(k+"-"+q.n);if(e)e.value=""}));localStorage.removeItem(key);saved={};status();O.className="out"};load();
</script></body></html>
