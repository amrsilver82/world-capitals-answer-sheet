<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Flags</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;color:#111827}.wrap{max-width:900px;margin:auto;padding:28px 16px 45px}header{text-align:center}h1{margin:0;font-size:30px}.sub{color:#6b7280}.count{display:inline-block;background:#f1f5f9;border-radius:999px;padding:6px 15px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.card{border:1px solid #e5e7eb;border-radius:12px;padding:15px;box-shadow:0 1px 3px #0001}.pic{display:flex;justify-content:center}.pic img{width:min(240px,100%);border:1px solid #9ca3af;border-radius:4px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:700}.st{font-size:12px;padding:4px 9px;border-radius:999px;background:#f1f5f9;color:#475569}.st.done{background:#dcfce7;color:#166534}input{width:100%;margin-top:8px;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}button{padding:10px 18px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;font-weight:700}button:first-child{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.45}.out{display:none;margin-top:20px;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.out.show{display:block}pre{white-space:pre-wrap}.small{font-size:12px;color:#6b7280;text-align:center}@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><main class="wrap"><header><h1 id="title">World Flags</h1><p class="sub">Look at each flag and type the country name. Leave unknown ones blank.</p><p id="count" class="count">Loading…</p></header><section id="grid" class="grid"></section><section class="actions"><button id="build">Build my reply</button><button id="copy" disabled>Copy reply</button><button id="clear">Clear all</button><button id="reload">Reload latest batch</button></section><p class="small">Answers save automatically on this device.</p><section id="out" class="out"><pre id="reply"></pre><p id="note"></p></section></main><script>
let m,qs=[],key="",saved={};const G=document.getElementById("grid"),C=document.getElementById("count"),O=document.getElementById("out"),R=document.getElementById("reply"),N=document.getElementById("note"),P=document.getElementById("copy");
async function load(){m=await fetch("batch.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json());document.getElementById("title").textContent=m.title+" — Batch "+m.batch+" (Q"+m.start_question+"–"+m.end_question+")";key=m.test_id+"-b"+m.batch;try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch{saved={}};qs=Array.from({length:m.question_count},(_,i)=>({n:m.start_question+i,f:(m.files&&m.files[i])||String(i+1).padStart(2,"0")+".svg"}));G.innerHTML="";qs.forEach(q=>{let d=document.createElement("div");d.className="card";d.innerHTML='<div class="pic"><img src="flags/'+q.f+'?v='+m.version+'" alt="Flag question '+q.n+'"></div><div class="row"><span>Flag '+q.n+'</span><span class="st" id="s'+q.n+'">Not answered</span></div><input id="q'+q.n+'" placeholder="Country name" autocomplete="off">';G.appendChild(d);let x=document.getElementById("q"+q.n);x.value=saved[q.n]||"";x.oninput=()=>{saved[q.n]=x.value;localStorage.setItem(key,JSON.stringify(saved));status();hide()}});status();hide()}
function val(n){return document.getElementById("q"+n).value.trim()}function status(){let a=0;qs.forEach(q=>{let yes=!!val(q.n),s=document.getElementById("s"+q.n);if(yes)a++;s.textContent=yes?"Done":"Not answered";s.className="st"+(yes?" done":"")});C.textContent=a+" answered · "+(qs.length-a)+" left"}function hide(){O.className="out";R.textContent="";N.textContent="";P.disabled=true}
document.getElementById("build").onclick=()=>{let l=[],b=[];qs.forEach(q=>{let a=val(q.n);a?l.push(q.n+". "+a):b.push(q.n)});R.textContent=l.join("\n");N.textContent=b.length?"Left blank for clues: "+b.join(", "):"All "+qs.length+" answered.";O.className="out show";P.disabled=!l.length};P.onclick=async()=>{try{await navigator.clipboard.writeText(R.textContent);P.textContent="Copied!";setTimeout(()=>P.textContent="Copy reply",1500)}catch{}};document.getElementById("clear").onclick=()=>{qs.forEach(q=>document.getElementById("q"+q.n).value="");localStorage.removeItem(key);saved={};status();hide()};document.getElementById("reload").onclick=load;addEventListener("pageshow",load);load();
</script></body></html>
