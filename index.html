<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>World Flags — Test 1 — Batch 9 (Q81–90)</title>
<meta name="description" content="Look at each flag and type the country name. Build a clean reply you can copy.">
<style>
:root{--bg:#fff;--fg:#0f172a;--card:#fff;--muted:#64748b;--soft:#f1f5f9;--border:#e2e8f0;--input:#cbd5e1;--blue:#2563eb;--blue2:#1d4ed8;--done-bg:#dcfce7;--done-fg:#166534;--todo-bg:#f1f5f9;--todo-fg:#475569}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}
.page{min-height:100vh;padding:32px 16px 48px}main{width:100%;max-width:896px;margin:0 auto}header{text-align:center}h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:16px}.counter{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:999px;background:var(--soft);font-weight:650;font-size:14px}
.grid{margin-top:32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}.flag-wrap{display:flex;align-items:center;justify-content:center}.flag-frame{display:block;width:min(100%,240px);border:1px solid rgba(15,23,42,.25);background:#f8fafc;padding:3px;border-radius:4px;box-shadow:0 1px 2px rgba(15,23,42,.08)}.flag-frame img{display:block;width:100%;height:auto;object-fit:contain}.flag-fallback{display:none;min-height:120px;align-items:center;justify-content:center;color:#b91c1c;font-weight:700;text-align:center}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}label{font-size:14px;font-weight:700}.status{font-size:12px;font-weight:750;border-radius:999px;padding:4px 9px;white-space:nowrap}.status.todo{background:var(--todo-bg);color:var(--todo-fg)}.status.done{background:var(--done-bg);color:var(--done-fg)}
input{margin-top:8px;width:100%;border:1px solid var(--input);border-radius:7px;background:white;color:var(--fg);padding:11px 12px;font-size:16px;outline:none}input:focus{border-color:#94a3b8;box-shadow:0 0 0 2px rgba(37,99,235,.18)}input::placeholder{color:#94a3b8}
.actions{margin-top:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}button{border-radius:7px;padding:11px 20px;font-size:14px;font-weight:750;cursor:pointer}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{border:1px solid var(--input);background:#fff;color:var(--fg)}.secondary:hover{background:#f8fafc}button:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;margin-top:24px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}.result.show{display:block}pre{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.note{margin:12px 0 0;color:var(--muted);font-size:14px}.save-note{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
@media(max-width:640px){.page{padding:24px 14px 40px}.grid{grid-template-columns:1fr;gap:14px;margin-top:24px}.card{padding:14px}.flag-frame{width:min(100%,280px)}.actions{gap:10px}button{flex:1 1 140px}}
</style>
</head>
<body>
<div class="page"><main>
<header>
<h1>World Flags — Test 1 — Batch 9 (Q81–90)</h1>
<p class="subtitle">Look at each flag and type the country name. Leave unknown ones blank.</p>
<p id="counter" class="counter" aria-live="polite">0 answered · 10 left</p>
</header>
<section id="grid" class="grid"></section>
<section class="actions">
<button id="buildBtn" type="button" class="primary">Build my reply</button>
<button id="copyBtn" type="button" class="secondary" disabled>Copy reply</button>
<button id="clearBtn" type="button" class="secondary">Clear all</button>
</section>
<p class="save-note">Answers are saved automatically on this device until you clear them.</p>
<section id="result" class="result" aria-live="polite"><pre id="reply"></pre><p id="blankNote" class="note"></p></section>
</main></div>
<script>
(()=>{"use strict";
const START=81,VERSION="b9-20260927",KEY="world-flags-test1-batch-9";
const questions=Array.from({length:10},(_,i)=>({n:START+i,file:"flags/"+String(i+1).padStart(2,"0")+".svg?v="+VERSION}));
const grid=document.getElementById("grid"),counter=document.getElementById("counter"),result=document.getElementById("result"),replyEl=document.getElementById("reply"),blankNote=document.getElementById("blankNote"),copyBtn=document.getElementById("copyBtn");
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{saved={}}
questions.forEach(q=>{
 const card=document.createElement("div");card.className="card";
 card.innerHTML='<div class="flag-wrap"><span class="flag-frame"><img src="'+q.file+'" alt="Flag question '+q.n+'" loading="eager"><span class="flag-fallback">Flag image unavailable</span></span></div><div class="label-row"><label for="q-'+q.n+'">Flag '+q.n+'</label><span id="status-'+q.n+'" class="status todo">Not answered</span></div><input id="q-'+q.n+'" type="text" placeholder="Country name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">';
 grid.appendChild(card);
 const img=card.querySelector("img"),fallback=card.querySelector(".flag-fallback");
 img.addEventListener("error",()=>{img.style.display="none";fallback.style.display="flex"});
 const input=card.querySelector("input");input.value=saved[q.n]||"";
 input.addEventListener("input",()=>{saved[q.n]=input.value;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}updateStatus();hideResult()});
});
function val(n){return(document.getElementById("q-"+n).value||"").trim()}
function updateStatus(){let a=0;questions.forEach(q=>{const d=val(q.n)!=="";if(d)a++;const s=document.getElementById("status-"+q.n);s.textContent=d?"Done":"Not answered";s.className="status "+(d?"done":"todo")});counter.textContent=a+" answered · "+(questions.length-a)+" left"}
function hideResult(){result.classList.remove("show");replyEl.textContent="";blankNote.textContent="";copyBtn.disabled=true;copyBtn.textContent="Copy reply"}
document.getElementById("buildBtn").addEventListener("click",()=>{const lines=[],blanks=[];questions.forEach(q=>{const a=val(q.n);a?lines.push(q.n+". "+a):blanks.push(q.n)});replyEl.textContent=lines.join("\n");blankNote.textContent=blanks.length?"Left blank for clues: "+blanks.join(", "):"All "+questions.length+" answered.";result.classList.add("show");copyBtn.disabled=lines.length===0;copyBtn.textContent="Copy reply";result.scrollIntoView({behavior:"smooth",block:"nearest"})});
copyBtn.addEventListener("click",async()=>{const text=replyEl.textContent;if(!text)return;let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{}if(!ok){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{ok=document.execCommand("copy")}catch{}ta.remove()}copyBtn.textContent=ok?"Copied!":"Copy failed";setTimeout(()=>copyBtn.textContent="Copy reply",1800)});
document.getElementById("clearBtn").addEventListener("click",()=>{questions.forEach(q=>document.getElementById("q-"+q.n).value="");saved={};try{localStorage.removeItem(KEY)}catch{}updateStatus();hideResult();window.scrollTo({top:0,behavior:"smooth"})});
updateStatus();
})();
</script>
</body></html>
