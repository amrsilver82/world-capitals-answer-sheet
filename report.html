<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Flags Report</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f7f9;color:#111827}.wrap{max-width:1180px;margin:auto;padding:28px 16px 50px}header{text-align:center}h1{margin:0 0 8px}.sub{color:#6b7280}.score{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 26px}.pill{background:#fff;border:1px solid #d1d5db;border-radius:999px;padding:8px 13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #d1d5db;border-radius:16px;padding:18px;box-shadow:0 2px 8px #0000000d}.q{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.qnum{font-size:20px;font-weight:800}.result{font-size:13px;font-weight:800;padding:5px 9px;border-radius:999px}.I{background:#dcfce7;color:#166534}.A{background:#fef3c7;color:#92400e}.W{background:#fee2e2;color:#991b1b}.C{background:#e5e7eb;color:#374151}.flag{display:flex;justify-content:center;background:#eef0f2;border:1px solid #cbd5e1;border-radius:10px;padding:14px}.flag img{display:block;width:min(500px,100%);height:auto;border:1px solid #9ca3af;border-radius:4px}.facts{margin-top:14px;display:grid;grid-template-columns:130px 1fr;gap:7px 12px;line-height:1.45}.label{font-weight:800;color:#4b5563}.note{margin-top:10px;padding:10px;border-radius:8px;background:#fff7ed;color:#9a3412;font-weight:600}.focus{margin-top:24px;background:white;border:1px solid #d1d5db;border-radius:12px;padding:16px}.nav{text-align:center;margin:18px 0}.nav input{width:90px;padding:8px}.nav button{padding:8px 12px;margin-left:6px}@media(max-width:900px){.grid{grid-template-columns:1fr}.flag img{width:min(620px,100%)}.facts{grid-template-columns:110px 1fr}}</style></head><body><main class="wrap"><header><h1 id="title">World Flags Report</h1><p class="sub" id="subtitle">Loading…</p></header><div class="nav"><input id="batchInput" type="number" min="1" placeholder="Batch"><button id="go">Open batch</button></div><section class="score" id="score"></section><section class="grid" id="grid"></section><section class="focus" id="focus"></section></main><script>
const repo='amrsilver82/world-capitals-answer-sheet';
const p=new URLSearchParams(location.search);const requested=p.get('batch');
const src=requested?'reports/batch'+String(requested).padStart(2,'0')+'.json':'report.json';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Report not found');return r.json()}).then(d=>{
 document.getElementById('title').textContent=d.title+' — Batch '+d.batch+' Report';
 document.getElementById('subtitle').textContent='Questions '+d.questions+' · large historical flag snapshots from the exact quiz batch';
 const s=d.batch_score,c=d.cumulative;
 document.getElementById('score').innerHTML='<span class="pill">Batch Pure: '+esc(s.pure_display)+'</span><span class="pill">Batch Pure + Assisted: '+esc(s.pa_display)+'</span><span class="pill">Cumulative Pure: '+esc(c.pure_display)+'</span><span class="pill">Cumulative Pure + Assisted: '+esc(c.pa_display)+'</span>';
 const labels={I:'Independent',A:'Assisted',W:'Wrong',C:'Cancelled'};
 const base='https://raw.githubusercontent.com/'+repo+'/'+encodeURIComponent(d.asset_commit)+'/flags/';
 document.getElementById('grid').innerHTML=d.records.map((r,i)=>'<article class="card"><div class="q"><span class="qnum">Flag '+r.q+'</span><span class="result '+r.result+'">'+labels[r.result]+'</span></div><div class="flag"><img src="'+base+encodeURIComponent(d.assets[i])+'" alt="Historical quiz flag '+r.q+'"></div><div class="facts"><div class="label">Your answer</div><div>'+esc((r.user_answers||[]).join(' → ')||'—')+'</div><div class="label">Correct</div><div><strong>'+esc(r.correct)+'</strong></div></div>'+(r.note?'<div class="note">'+esc(r.note)+'</div>':'')+'</article>').join('');
 document.getElementById('focus').innerHTML='<strong>Study Focus:</strong> '+esc(d.study_focus||'None');
}).catch(e=>{document.getElementById('subtitle').textContent=e.message;document.getElementById('focus').textContent='This report is not available yet.'});
document.getElementById('go').onclick=()=>{const b=document.getElementById('batchInput').value;if(b)location.href='report.html?batch='+encodeURIComponent(b)};
</script></body></html>
