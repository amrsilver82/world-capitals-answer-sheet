<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Flags + Capitals — Edition 1</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#111827}.wrap{max-width:1120px;margin:auto;padding:24px 14px 44px}header{text-align:center}h1{margin:0 0 6px;font-size:29px}.sub{color:#64748b;margin:6px auto;max-width:760px}.pill{display:inline-block;background:#e2e8f0;border-radius:999px;padding:6px 13px;font-weight:700;margin:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.qno{font-weight:800}.stage{font-size:12px;color:#64748b}.pic{display:flex;justify-content:center;align-items:center;margin-bottom:13px;padding:12px;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:10px}.pic img{width:min(420px,100%);display:block;background:#fff;border:2px solid #475569;border-radius:4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.label{font-size:13px;font-weight:800;margin-bottom:5px}.clue{font-size:13px;font-weight:800;color:#92400e;background:#fef3c7;border-radius:7px;padding:6px 8px;margin-bottom:6px}.locked{min-height:46px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:8px;padding:11px;font-weight:750}.revealed{border-color:#fecaca;background:#fef2f2}.cancelled{border-color:#cbd5e1;background:#f1f5f9;color:#64748b}.tag{display:block;font-size:11px;font-weight:650;color:#64748b;margin-top:4px}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}input:focus{outline:2px solid #2563eb;outline-offset:1px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}button{padding:11px 17px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:750;font-size:15px}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.45}.out{display:none;margin-top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:15px}.out.show{display:block}pre{white-space:pre-wrap;word-break:break-word}.small{font-size:12px;color:#64748b;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.pair{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><main class="wrap">
<header><h1 id="title">World Flags + Capitals — Edition 1</h1>
<p class="sub">V2 commit-pinned quiz shell. Each URL loads one immutable stage directly from GitHub.</p>
<div><span id="stagePill" class="pill">Loading stage…</span><span id="count" class="pill">Loading…</span></div></header>
<section id="grid" class="grid"></section>
<section class="actions"><button id="build" class="primary">Build my reply</button><button id="copy" disabled>Copy reply</button><button id="clear">Clear editable fields</button><button id="latest">Open latest stage</button></section>
<p class="small">Answers save only on this device for this exact immutable stage URL.</p>
<section id="out" class="out"><pre id="reply"></pre><p id="note"></p></section>
</main><script>
const OWNER="amrsilver82",REPO="world-capitals-answer-sheet";
const params=new URLSearchParams(location.search);
const sha=params.get("sha")||"", path=params.get("state")||"";
const validSha=/^[0-9a-f]{40}$/i.test(sha), validPath=/^v2\/states\/[A-Za-z0-9._\/-]+\.json$/.test(path);
let m=null,qs=[],key="",saved={};
const G=document.getElementById("grid"),C=document.getElementById("count"),O=document.getElementById("out"),R=document.getElementById("reply"),N=document.getElementById("note"),P=document.getElementById("copy"),SP=document.getElementById("stagePill");
function esc(s){return String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[x]))}
function rawUrl(ref,p){return "https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+encodeURIComponent(ref)+"/"+p.split("/").map(encodeURIComponent).join("/")}
function editable(c){return !c||c.mode==="input"}
function id(kind,n){return(kind==="country"?"country-":"capital-")+n}
function field(q,kind){const c=q[kind]||{mode:"input"},label=kind==="country"?"Country":"Capital";let h='<div class="field"><div class="label">'+label+'</div>';if(c.clue)h+='<div class="clue">'+label+' clue: '+esc(c.clue)+'</div>';if(c.mode==="input")h+='<input id="'+id(kind,q.n)+'" placeholder="'+label+'" autocomplete="off">';else if(c.mode==="locked")h+='<div class="locked '+(c.revealed?"revealed":"")+'">'+esc(c.value||"")+'<span class="tag">'+(c.revealed?"Revealed":"Resolved")+'</span></div>';else if(c.mode==="cancelled")h+='<div class="locked cancelled">'+esc(c.text||"Not scored")+'</div>';return h+"</div>"}
function val(q,kind){const e=document.getElementById(id(kind,q.n));return e?e.value.trim():""}
function render(d){m=d;qs=d.questions||[];document.getElementById("title").textContent=d.title+" — Batch "+d.batch+" (Q"+d.start_question+"–"+d.end_question+")";SP.textContent="Stage "+d.stage+" · "+(d.stage_label||d.stage_kind||"current");key="v2-"+sha+"-"+path;try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch{saved={}}G.innerHTML="";qs.forEach(q=>{const c=document.createElement("div");c.className="card";const asset=q.asset.startsWith("http")?q.asset:q.asset;c.innerHTML='<div class="top"><span class="qno">Question '+q.n+'</span><span class="stage" id="st'+q.n+'"></span></div><div class="pic"><img src="'+esc(asset)+'" alt="Flag question '+q.n+'"></div><div class="pair">'+field(q,"country")+field(q,"capital")+"</div>";G.appendChild(c);["country","capital"].forEach(kind=>{const e=document.getElementById(id(kind,q.n));if(e&&editable(q[kind])){const sk=q.n+"-"+kind;e.value=saved[sk]||"";e.oninput=()=>{saved[sk]=e.value;localStorage.setItem(key,JSON.stringify(saved));status();hide()}}})});status();hide()}
function status(){let e=0,a=0;qs.forEach(q=>{let qe=0,qa=0;["country","capital"].forEach(k=>{if(editable(q[k])){e++;qe++;if(val(q,k)){a++;qa++}}});const s=document.getElementById("st"+q.n);if(s)s.textContent=qe?qa+"/"+qe+" current fields answered":"Resolved"});C.textContent=a+" answered · "+(e-a)+" current fields left"}
function hide(){O.className="out";R.textContent="";N.textContent="";P.disabled=true}
function build(){const lines=[],blank=[];qs.forEach(q=>{const parts=[];if(editable(q.country)){const v=val(q,"country");if(v)parts.push("Country: "+v);else blank.push("Q"+q.n+" Country")}if(editable(q.capital)){const v=val(q,"capital");if(v)parts.push("Capital: "+v);else blank.push("Q"+q.n+" Capital")}if(parts.length)lines.push(q.n+". "+parts.join(" | "))});R.textContent=lines.join("\n");N.textContent=blank.length?"Left blank: "+blank.join(", "):"All current editable fields answered.";O.className="out show";P.disabled=!lines.length;return R.textContent}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{return false}}
async function load(){if(!validSha||!validPath){C.textContent="Invalid or missing immutable V2 state reference.";return}try{const r=await fetch(rawUrl(sha,path),{cache:"no-store"});if(!r.ok)throw Error("state fetch failed");const d=await r.json();if(String(d.public_commit||sha)!==sha)throw Error("state SHA mismatch");render(d)}catch(e){C.textContent="Could not load this immutable stage: "+e.message}}
document.getElementById("build").onclick=build;P.onclick=async()=>{const t=build();N.textContent=(await copyText(t)?"Copied. ":"Copy failed. ")+N.textContent};document.getElementById("clear").onclick=()=>{qs.forEach(q=>["country","capital"].forEach(k=>{const e=document.getElementById(id(k,q.n));if(e)e.value=""}));localStorage.removeItem(key);saved={};status();hide()};
document.getElementById("latest").onclick=async()=>{try{const r=await fetch(rawUrl("main","v2/latest.json")+"?t="+Date.now(),{cache:"no-store"});const x=await r.json();location.href="combined-v2.html?sha="+encodeURIComponent(x.public_commit)+"&state="+encodeURIComponent(x.state_path)}catch(e){N.textContent="Latest-stage pointer is not available yet.";O.className="out show"}};
load();
</script></body></html>
