name: Location Pilot Chad and Mobile Regression
on:
  push:
    paths:
      - 'pilot/location/**'
      - '.github/workflows/location-map-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/map-test-server.log 2>&1 &
          sleep 2
      - name: Chad touch and reset regression
        run: node pilot/location/test/chad-regression.mjs
