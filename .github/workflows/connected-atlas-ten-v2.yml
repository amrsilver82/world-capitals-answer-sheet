name: Connected Atlas V2 Full Flags and Chad Regression
on:
  push:
    paths:
      - 'pilot/connected-atlas-ten-v2/**'
      - '.github/workflows/connected-atlas-ten-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wcg-connected-v2.log 2>&1 &
          sleep 2
      - name: Confirm large flags, Chad hitbox and integrated atlas
        run: node pilot/connected-atlas-ten-v2/test/regression.mjs
