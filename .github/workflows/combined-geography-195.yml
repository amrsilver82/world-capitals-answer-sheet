name: Combined Geography 195 Integration Regression
on:
  push:
    paths:
      - 'pilot/combined-geography-195/**'
      - '.github/workflows/combined-geography-195.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-sync:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Start static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/combined195.log 2>&1 &
          sleep 2
      - name: Test GitHub draft event replay and 195-country manifest
        run: node pilot/combined-geography-195/test/sync-unit.mjs
      - name: Test read-only completed-batch handoff
        run: node pilot/combined-geography-195/test/handoff.test.mjs
      - name: Check safe GitHub auth diagnostics
        run: node pilot/combined-geography-195/test/permission-diagnostics.mjs
      - name: Test desktop Chromium and simulated mobile WebKit
        run: node pilot/combined-geography-195/test/regression.mjs
      - name: Test normal 195 page against mandatory UI URL contract
        run: node pilot/combined-geography-195/test/contract-normal.mjs
      - name: Test one-click Finish Reveal Copy in normal local and verified modes
        run: node pilot/combined-geography-195/test/finish-batch.mjs
      - name: Verify real saved-Q atlas and broad-area screenshot contract
        run: node pilot/combined-geography-195/test/repair-normal.mjs
      - name: Test isolated one-question GitHub browser acceptance mode
        run: node pilot/combined-geography-195/test/acceptance.mjs

      - name: Preserve deterministic sanitized normal-route screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-195-desktop-mobile-repair-screenshots
          path: pilot/combined-geography-195/test/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
