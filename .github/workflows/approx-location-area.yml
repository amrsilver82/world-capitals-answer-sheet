name: Grid-Free Approximate Atlas Regression
on:
  push:
    paths:
      - 'pilot/approx-location-area/**'
      - '.github/workflows/approx-location-area.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/approx-area.log 2>&1 &
          sleep 2
      - name: Test grid-free selection
        run: node pilot/approx-location-area/test/regression.mjs
