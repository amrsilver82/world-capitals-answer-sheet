name: Language Edition 1 Format Guard
on:
  push:
    branches: [main]
    paths:
      - 'languages-v1.html'
      - 'languages/reports/edition-1/**'
      - 'languages/tools/check-edition1-format.mjs'
      - 'pilot/languages-three-category-acceptance-20261015/report.html'
      - '.github/workflows/language-edition1-format-guard.yml'
  pull_request:
    paths:
      - 'languages-v1.html'
      - 'languages/reports/edition-1/**'
      - 'languages/tools/check-edition1-format.mjs'
      - 'pilot/languages-three-category-acceptance-20261015/report.html'
      - '.github/workflows/language-edition1-format-guard.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official three-category question/results formatting
        run: node languages/tools/check-edition1-format.mjs
