name: Connected Ten-Country Atlas Layout Regression
on:
  push:
    paths:
      - 'pilot/connected-atlas-ten/**'
      - 'pilot/connected-triple-one/app.js'
      - 'pilot/connected-triple-one/style.css'
      - '.github/workflows/connected-atlas-ten.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local static file server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/connected-ten.log 2>&1 &
          sleep 2
      - name: Desktop and mobile atlas interaction regression
        run: node pilot/connected-atlas-ten/test/regression.mjs
