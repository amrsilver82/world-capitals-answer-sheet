name: Three Category Report Publisher
on:
  push:
    branches: [main]
    paths:
      - 'languages/publish/ed2-b01-payload.json'
permissions:
  contents: write
concurrency:
  group: three-category-edition2-report
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified completed edition 2 batch and frozen next flags
        env:
          TZ: Africa/Cairo
        run: node languages/tools/publish-edition2-b01.mjs
