name: Connected One-Country Atlas Regression
on:
  push:
    paths:
      - 'pilot/connected-triple-one/**'
      - '.github/workflows/connected-triple-one.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/connected-atlas.log 2>&1 &
          sleep 2
      - name: Run two-view browser regression
        run: node pilot/connected-triple-one/test/regression.mjs
