name: Location Pilot Smoke Test
on:
  push:
    paths:
      - 'pilot/location-v1/**'
      - '.github/workflows/location-pilot-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/location-pilot-server.log 2>&1 &
          sleep 2
      - name: Browser smoke test (desktop and iPad-size)
        run: node pilot/location-v1/test/smoke.mjs
