name: Geography Fun V2 Browser Regression
on:
  push:
    paths:
      - 'pilot/geography-fun-v2/**'
      - '.github/workflows/geography-fun-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright package
        run: npm install --no-save playwright@1.56.1
      - name: Serve preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wcg-fun-v2.log 2>&1 &
          sleep 2
      - name: Validate standalone V2 against V1
        run: node pilot/geography-fun-v2/test/regression.mjs
